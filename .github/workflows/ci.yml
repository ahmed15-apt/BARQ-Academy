name: CI Infrastructure Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-stack:
    name: Build, Scan and Validate
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Prepare environment variables
      - name: Setup Environment
        run: cp .env.example .env

      # 3. Syntax / Compose checks
      - name: Validate Docker Compose Config
        run: docker compose config --quiet

      # 4. Extra Credit: Container Image Security Scan (Trivy)
      - name: Security Scan Container Images
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'HIGH,CRITICAL'

      # 5. Build images
      - name: Build Stack Images
        run: docker compose build

      # 6. Start stack services
      - name: Start Stack Containers
        run: docker compose up -d

      # 7. Bounded wait for stack readiness
      - name: Wait for Services Readiness
        run: |
          echo "Waiting for stack readiness via /ready endpoint..."
          for i in {1..30}; do
            STATUS=$(curl -s http://127.0.0.1:8080/ready | grep -o '"status":"ready"' || true)
            if [ "$STATUS" = '"status":"ready"' ]; then
              echo "Stack is ready and fully operational!"
              exit 0
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done
          echo "Error: Bounded timeout reached waiting for ready status."
          docker compose logs
          exit 1

      # 8. Run bounded python validation suite (Fails CI on non-zero exit)
      - name: Run Validation Suite
        run: python3 validate.py

      # 9. Clean up stack on completion
      - name: Tear Down Stack
        if: always()
        run: docker compose down -v
