name: CI Infrastructure Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Job 1: Static and Image Security Scanning on GitHub-hosted runner
  security-scan:
    name: Security & Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Run Trivy and output results to a file
      - name: Security Scan Container Images
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          output: 'trivy-report.txt'
          severity: 'HIGH,CRITICAL'

      # 2. Upload scan report as a downloadable GitHub artifact
      - name: Upload Security Scan Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-vulnerability-report
          path: trivy-report.txt

  # Job 2: Build, Deploy & Validate on Self-Hosted runner
  validate-stack:
    name: Build and Validate Stack
    needs: security-scan
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Config
        run: docker compose config --quiet

      - name: Build Stack Images
        run: docker compose build

      - name: Start Stack Containers
        run: docker compose up -d

      - name: Wait for Services Readiness
        run: |
          echo "Waiting for stack readiness via /ready endpoint..."
          for i in {1..30}; do
            RESPONSE=$(curl -s http://127.0.0.1:8090/ready || true)
            STATUS=$(echo "$RESPONSE" | grep -oE '"status":"(ok|ready)"' || true)
            if [ -n "$STATUS" ]; then
              echo "Stack is ready and fully operational!"
              exit 0
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done
          echo "Error: Bounded timeout reached waiting for ready status."
          docker compose logs
          exit 1

      - name: Run Validation Suite
        run: python3 validate.py

      - name: Tear Down Stack
        if: always()
        run: docker compose down -v
